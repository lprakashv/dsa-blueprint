name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - name: Build site
        env:
          GOOGLE_TAG_ID: ${{ secrets.GOOGLE_TAG_ID }}
        run: npm run build
      # Capture the production output so the screenshot matches the deploy artifact.
      - name: Capture README screenshot
        run: |
          ./node_modules/.bin/course-board preview > /tmp/dsa-blueprint-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ > /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,900 --virtual-time-budget=3000 \
            --screenshot="$PWD/dist/screenshot.png" http://127.0.0.1:4174/
          test -s dist/screenshot.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Pull requests run the build job. Deployment requires a push or manual run.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
