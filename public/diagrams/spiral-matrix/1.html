<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read the top row left to right</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="matrix-diagram"><table aria-label="Output: 1, 2, 3, 4">
    <thead><tr><td></td><th scope="col">0</th><th scope="col">1</th><th scope="col">2</th><th scope="col">3</th></tr></thead>
    <tbody><tr><th scope="row">0</th><td><span class="array-cell is-active">
        1<span class="sr-only">, Current segment</span></span></td><td><span class="array-cell is-active">
        2<span class="sr-only">, Current segment</span></span></td><td><span class="array-cell is-active">
        3<span class="sr-only">, Current segment</span></span></td><td><span class="array-cell is-active">
        4<span class="sr-only">, Current segment</span></span></td></tr><tr><th scope="row">1</th><td><span class="array-cell ">
        5</span></td><td><span class="array-cell ">
        6</span></td><td><span class="array-cell ">
        7</span></td><td><span class="array-cell ">
        8</span></td></tr><tr><th scope="row">2</th><td><span class="array-cell ">
        9</span></td><td><span class="array-cell ">
        10</span></td><td><span class="array-cell ">
        11</span></td><td><span class="array-cell ">
        12</span></td></tr></tbody>
  </table><p class="scene-note">Output: 1, 2, 3, 4</p></div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current segment</li><li><span class="legend-dot teal" aria-hidden="true"></span>Read</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other cells</li></ul>
  </main>
</body>
</html>
