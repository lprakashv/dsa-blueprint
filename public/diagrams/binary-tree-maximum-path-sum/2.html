<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start with one-node paths</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="graph-diagram "><svg viewBox="0 0 420 240" role="img" aria-label="Gain(3) = 3 · Gain(−6) = −6" aria-describedby="graph-description">
    <desc id="graph-description">−5. 4. 8. 3. −6. −5 to 4. −5 to 8. 4 to 3. 4 to −6.</desc>

    <g class="graph-edge">
    <line x1="210" y1="36" x2="126" y2="112.8"
      />

  </g><g class="graph-edge">
    <line x1="210" y1="36" x2="302.40000000000003" y2="112.8"
      />

  </g><g class="graph-edge">
    <line x1="126" y1="112.8" x2="67.2" y2="192"
      />

  </g><g class="graph-edge">
    <line x1="126" y1="112.8" x2="180.6" y2="192"
      />

  </g>

    <g class="graph-node" transform="translate(210 36)">
        <title>−5</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">−5</text>

      </g><g class="graph-node" transform="translate(126 112.8)">
        <title>4</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">4</text>

      </g><g class="graph-node" transform="translate(302.40000000000003 112.8)">
        <title>8</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">8</text>

      </g><g class="graph-node is-visited" transform="translate(67.2 192)">
        <title>3</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">3</text>

      </g><g class="graph-node is-visited is-active" transform="translate(180.6 192)">
        <title>−6, current</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">−6</text>

      </g>
  </svg><p class="scene-note">Gain(3) = 3 · Gain(−6) = −6</p></div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current node</li><li><span class="legend-dot teal" aria-hidden="true"></span>Visited</li><li><span class="legend-dot gray" aria-hidden="true"></span>Unvisited</li></ul>
  </main>
</body>
</html>
