<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Count the isolated cell</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="matrix-diagram"><table aria-label="3 connected components">
    <thead><tr><td></td><th scope="col">0</th><th scope="col">1</th><th scope="col">2</th><th scope="col">3</th></tr></thead>
    <tbody><tr><th scope="row">0</th><td><span class="array-cell is-match">
        1<span class="sr-only">, Visited land</span></span></td><td><span class="array-cell is-match">
        1<span class="sr-only">, Visited land</span></span></td><td><span class="array-cell matrix-blocked">
        0<span class="sr-only">, Water</span></span></td><td><span class="array-cell matrix-blocked">
        0<span class="sr-only">, Water</span></span></td></tr><tr><th scope="row">1</th><td><span class="array-cell matrix-blocked">
        0<span class="sr-only">, Water</span></span></td><td><span class="array-cell is-match">
        1<span class="sr-only">, Visited land</span></span></td><td><span class="array-cell matrix-blocked">
        0<span class="sr-only">, Water</span></span></td><td><span class="array-cell is-match">
        1<span class="sr-only">, Visited land</span></span></td></tr><tr><th scope="row">2</th><td><span class="array-cell is-active">
        1<span class="sr-only">, Current island</span></span></td><td><span class="array-cell matrix-blocked">
        0<span class="sr-only">, Water</span></span></td><td><span class="array-cell matrix-blocked">
        0<span class="sr-only">, Water</span></span></td><td><span class="array-cell is-match">
        1<span class="sr-only">, Visited land</span></span></td></tr></tbody>
  </table><p class="scene-note">3 connected components</p></div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current island</li><li><span class="legend-dot teal" aria-hidden="true"></span>Visited land</li><li><span class="legend-dot gray" aria-hidden="true"></span>Water</li></ul>
  </main>
</body>
</html>
