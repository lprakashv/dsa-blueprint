<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store each opening bracket</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="stack-diagram">
    <div class="stack-input"><span class="lane-label">INPUT</span><div class="lane-cells"><span class="array-cell">{</span><span class="array-cell is-active">[</span><span class="array-cell">]</span><span class="array-cell">}</span></div></div>
    <div class="stack-output"><span class="lane-label">STACK</span><div class="stack-box">
      <span class="array-cell">{</span><span class="array-cell is-active">[</span>
    </div></div>
  </div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current value</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other value</li></ul>
  </main>
</body>
</html>
