<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Record the empty subset</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="graph-diagram "><svg viewBox="0 0 420 240" role="img" aria-label="Output: [[]]" aria-describedby="graph-description">
    <desc id="graph-description">∅. 1. 2. 1, 2. ∅ to 1. ∅ to 2. 1 to 1, 2.</desc>

    <g class="graph-edge">
    <line x1="210" y1="36" x2="121.80000000000001" y2="112.8"
      />

  </g><g class="graph-edge">
    <line x1="210" y1="36" x2="298.2" y2="112.8"
      />

  </g><g class="graph-edge">
    <line x1="121.80000000000001" y1="112.8" x2="75.60000000000001" y2="192"
      />

  </g>

    <g class="graph-node is-active" transform="translate(210 36)">
        <title>∅, current</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">∅</text>

      </g><g class="graph-node" transform="translate(121.80000000000001 112.8)">
        <title>1</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">1</text>

      </g><g class="graph-node" transform="translate(298.2 112.8)">
        <title>2</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">2</text>

      </g><g class="graph-node" transform="translate(75.60000000000001 192)">
        <title>1, 2</title>
        <rect x="-24" y="-20" width="48" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">1, 2</text>

      </g>
  </svg><p class="scene-note">Output: [[]]</p></div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current node</li><li><span class="legend-dot teal" aria-hidden="true"></span>Visited</li><li><span class="legend-dot gray" aria-hidden="true"></span>Unvisited</li></ul>
  </main>
</body>
</html>
