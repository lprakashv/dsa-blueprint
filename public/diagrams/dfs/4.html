<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore the other branch</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="graph-diagram "><svg viewBox="0 0 420 240" role="img" aria-label="Visit order: A, B, D, E, C, F" aria-describedby="graph-description">
    <desc id="graph-description">A. B. C. D. E. F. A to B. A to C. B to D. B to E. C to F.</desc>

    <g class="graph-edge">
    <line x1="210" y1="36" x2="121.80000000000001" y2="112.8"
      />

  </g><g class="graph-edge">
    <line x1="210" y1="36" x2="298.2" y2="112.8"
      />

  </g><g class="graph-edge">
    <line x1="121.80000000000001" y1="112.8" x2="63" y2="192"
      />

  </g><g class="graph-edge">
    <line x1="121.80000000000001" y1="112.8" x2="176.4" y2="192"
      />

  </g><g class="graph-edge">
    <line x1="298.2" y1="112.8" x2="336" y2="192"
      />

  </g>

    <g class="graph-node is-visited" transform="translate(210 36)">
        <title>A</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">A</text>

      </g><g class="graph-node is-visited" transform="translate(121.80000000000001 112.8)">
        <title>B</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">B</text>

      </g><g class="graph-node is-visited" transform="translate(298.2 112.8)">
        <title>C</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">C</text>

      </g><g class="graph-node is-visited" transform="translate(63 192)">
        <title>D</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">D</text>

      </g><g class="graph-node is-visited" transform="translate(176.4 192)">
        <title>E</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">E</text>

      </g><g class="graph-node is-active" transform="translate(336 192)">
        <title>F, current</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">F</text>

      </g>
  </svg><p class="scene-note">Visit order: A, B, D, E, C, F</p></div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current node</li><li><span class="legend-dot teal" aria-hidden="true"></span>Visited</li><li><span class="legend-dot gray" aria-hidden="true"></span>Unvisited</li></ul>
  </main>
</body>
</html>
