name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - name: Build site
        env:
          GOOGLE_TAG_ID: ${{ secrets.GOOGLE_TAG_ID }}
        run: npm run build
      - name: Capture README screenshot
        id: screenshot
        uses: lprakashv/capture-and-update-screenshot-action@7427188b6422a213e031886a059ede1b1d9f6f2f
        with:
          config: screenshots.json
          source: repository
          start-command: npm run run
          base-url: http://127.0.0.1:4174
      - name: Add screenshot to site
        run: cp "$SCREENSHOT_DIRECTORY/screenshot.png" dist/screenshot.png
        env:
          SCREENSHOT_DIRECTORY: ${{ steps.screenshot.outputs.directory }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Pull requests run the build job. Deployment requires a push or manual run.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
