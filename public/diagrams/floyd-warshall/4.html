<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read any pair’s shortest distance</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="matrix-diagram"><table aria-label="Final distance A → C = 5">
    <thead><tr><td></td><th scope="col">A</th><th scope="col">B</th><th scope="col">C</th></tr></thead>
    <tbody><tr><th scope="row">A</th><td><span class="array-cell ">
        0</span></td><td><span class="array-cell ">
        3</span></td><td><span class="array-cell is-match">
        5<span class="sr-only">, Processed cell</span></span></td></tr><tr><th scope="row">B</th><td><span class="array-cell ">
        ∞</span></td><td><span class="array-cell ">
        0</span></td><td><span class="array-cell ">
        2</span></td></tr><tr><th scope="row">C</th><td><span class="array-cell ">
        ∞</span></td><td><span class="array-cell ">
        ∞</span></td><td><span class="array-cell ">
        0</span></td></tr></tbody>
  </table><p class="scene-note">Final distance A → C = 5</p></div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current cells</li><li><span class="legend-dot teal" aria-hidden="true"></span>Processed cells</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other cells</li></ul>
  </main>

</html>
