<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark the inclusive rectangle</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="matrix-diagram"><table aria-label="Query: rows 1–2 · columns 1–2">
    <thead><tr><td></td><th scope="col">0</th><th scope="col">1</th><th scope="col">2</th></tr></thead>
    <tbody><tr><th scope="row">0</th><td><span class="array-cell ">
        1</span></td><td><span class="array-cell ">
        2</span></td><td><span class="array-cell ">
        3</span></td></tr><tr><th scope="row">1</th><td><span class="array-cell ">
        4</span></td><td><span class="array-cell is-active">
        5<span class="sr-only">, Query rectangle</span></span></td><td><span class="array-cell is-active">
        6<span class="sr-only">, Query rectangle</span></span></td></tr><tr><th scope="row">2</th><td><span class="array-cell ">
        7</span></td><td><span class="array-cell is-active">
        8<span class="sr-only">, Query rectangle</span></span></td><td><span class="array-cell is-active">
        9<span class="sr-only">, Query rectangle</span></span></td></tr></tbody>
  </table><p class="scene-note">Query: rows 1–2 · columns 1–2</p></div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Query rectangle</li><li><span class="legend-dot teal" aria-hidden="true"></span>Processed cells</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other cells</li></ul>
  </main>
</body>
</html>
