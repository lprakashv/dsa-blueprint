<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visit children before their parent</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="graph-diagram "><svg viewBox="0 0 420 240" role="img" aria-label="Postorder: D, E, B, C, A" aria-describedby="graph-description">
    <desc id="graph-description">A. B. C. D. E. A to B. A to C. B to D. B to E.</desc>

    <g class="graph-edge">
    <line x1="210" y1="36" x2="121.80000000000001" y2="115.19999999999999"
      />

  </g><g class="graph-edge">
    <line x1="210" y1="36" x2="302.40000000000003" y2="115.19999999999999"
      />

  </g><g class="graph-edge">
    <line x1="121.80000000000001" y1="115.19999999999999" x2="58.800000000000004" y2="194.4"
      />

  </g><g class="graph-edge">
    <line x1="121.80000000000001" y1="115.19999999999999" x2="176.4" y2="194.4"
      />

  </g>

    <g class="graph-node is-active" transform="translate(210 36)">
        <title>A, current</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">A</text>

      </g><g class="graph-node" transform="translate(121.80000000000001 115.19999999999999)">
        <title>B</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">B</text>

      </g><g class="graph-node" transform="translate(302.40000000000003 115.19999999999999)">
        <title>C</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">C</text>

      </g><g class="graph-node" transform="translate(58.800000000000004 194.4)">
        <title>D</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">D</text>

      </g><g class="graph-node" transform="translate(176.4 194.4)">
        <title>E</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">E</text>

      </g>
  </svg><p class="scene-note">Postorder: D, E, B, C, A</p></div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current node</li><li><span class="legend-dot teal" aria-hidden="true"></span>Visited</li><li><span class="legend-dot gray" aria-hidden="true"></span>Unvisited</li></ul>
  </main>
</body>
</html>
