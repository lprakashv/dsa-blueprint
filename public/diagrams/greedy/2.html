<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Take the earliest finish</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="interval-diagram">
    <div class="interval-axis"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>
    <div class="interval-group"><span class="lane-label">Order</span>
      <div class="interval-tracks"><div class="interval-track">
        <span class="interval-bar is-active" style="--start:0%;--length:33.33333333333333%">1–3</span>
      </div><div class="interval-track">
        <span class="interval-bar" style="--start:16.666666666666664%;--length:33.33333333333333%">2–4</span>
      </div><div class="interval-track">
        <span class="interval-bar" style="--start:33.33333333333333%;--length:33.33333333333333%">3–5</span>
      </div><div class="interval-track">
        <span class="interval-bar" style="--start:66.66666666666666%;--length:33.33333333333333%">5–7</span>
      </div></div></div><div class="interval-group"><span class="lane-label">Chosen</span>
      <div class="interval-tracks"><div class="interval-track">
        <span class="interval-bar is-active" style="--start:0%;--length:33.33333333333333%">1–3</span>
      </div></div></div>
    <p class="scene-note">Free at 3</p>
  </div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Selected range</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other range</li></ul>
  </main>
</body>
</html>
