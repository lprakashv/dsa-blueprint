<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Count paths into step 2</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="lane-diagram">
    <div class="lane"><span class="lane-label">Step</span><div class="lane-cells"><span class="array-cell is-active">0</span><span class="array-cell is-active">1</span><span class="array-cell">2</span><span class="array-cell">3</span><span class="array-cell">4</span></div></div>
    <div class="lane"><span class="lane-label">Ways</span><div class="lane-cells"><span class="array-cell">1</span><span class="array-cell">1</span><span class="array-cell is-active">2</span><span class="array-cell">—</span><span class="array-cell">—</span></div></div>
    <p class="scene-note">ways[2] = 1 + 1 = 2</p>
  </div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current value</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other value</li></ul>
  </main>
</body>
</html>
