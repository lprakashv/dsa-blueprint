<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start with the first element</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="lane-diagram">
    <div class="lane"><span class="lane-label">Input</span><div class="lane-cells"><span class="array-cell is-active">2</span><span class="array-cell">-3</span><span class="array-cell">-2</span><span class="array-cell">0</span><span class="array-cell">4</span></div></div>
    <div class="lane"><span class="lane-label">Minimum</span><div class="lane-cells"><span class="array-cell">2</span></div></div>
    <div class="lane"><span class="lane-label">Maximum</span><div class="lane-cells"><span class="array-cell">2</span></div></div>
    <p class="scene-note">Best = 2</p>
  </div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current value</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other value</li></ul>
  </main>
</body>
</html>
