<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep both views of the values</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="lane-diagram">
    <div class="lane"><span class="lane-label">Values</span><div class="lane-cells"><span class="array-cell">7</span><span class="array-cell">4</span><span class="array-cell">9</span></div></div>
    <div class="lane"><span class="lane-label">Indices by value</span><div class="lane-cells"><span class="array-cell">7→0</span><span class="array-cell">4→1</span><span class="array-cell">9→2</span></div></div>
    <p class="scene-note">Three occupied indices</p>
  </div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current value</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other value</li></ul>
  </main>
</body>
</html>
