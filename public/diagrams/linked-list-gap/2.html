<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Move the lead pointer two links</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="lane-diagram">
    <div class="lane"><span class="lane-label">Lead</span><div class="lane-cells"><span class="array-cell">dummy</span><span class="array-cell">A</span><span class="array-cell is-active">B</span><span class="array-cell">C</span><span class="array-cell">D</span><span class="array-cell">null</span></div></div>
    <div class="lane"><span class="lane-label">Follow</span><div class="lane-cells"><span class="array-cell is-active">dummy</span><span class="array-cell">A</span><span class="array-cell">B</span><span class="array-cell">C</span><span class="array-cell">D</span><span class="array-cell">null</span></div></div>
    <p class="scene-note">Lead = B · Follow = dummy</p>
  </div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current value</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other value</li></ul>
  </main>
</body>
</html>
