<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set the starting references</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="linked-diagram">
    <div class="link-row"><div class="link-item"><span class="array-cell is-active">A</span>
      <span class="link-target">↳ B</span></div><div class="link-item"><span class="array-cell">B</span>
      <span class="link-target">↳ C</span></div><div class="link-item"><span class="array-cell">C</span>
      <span class="link-target">↳ null</span></div></div>
    <p class="scene-note">prev = null · cur = A</p>
  </div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current value</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other value</li></ul>
  </main>
</body>
</html>
