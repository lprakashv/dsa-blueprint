<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Count incoming dependencies</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="lane-diagram">
    <div class="lane"><span class="lane-label">Task</span><div class="lane-cells"><span class="array-cell is-active">A</span><span class="array-cell">B</span><span class="array-cell">C</span><span class="array-cell">D</span></div></div>
    <div class="lane"><span class="lane-label">In-degree</span><div class="lane-cells"><span class="array-cell is-active">0</span><span class="array-cell">1</span><span class="array-cell">1</span><span class="array-cell">2</span></div></div>
    <p class="scene-note">Ready: [A]</p>
  </div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current value</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other value</li></ul>
  </main>
</body>
</html>
