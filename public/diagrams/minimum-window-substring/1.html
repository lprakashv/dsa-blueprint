<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track missing occurrences</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="array-diagram" style="--count:7">
    <div class="array-label"><span>INDEX</span><span>VALUE</span></div>
    <div class="array-cells"><div class="array-slot">
      <span class="array-index">0</span>
      <span class="array-cell">C</span>
      <div class="marker"></div>
    </div><div class="array-slot">
      <span class="array-index">1</span>
      <span class="array-cell">A</span>
      <div class="marker"></div>
    </div><div class="array-slot">
      <span class="array-index">2</span>
      <span class="array-cell">B</span>
      <div class="marker"></div>
    </div><div class="array-slot">
      <span class="array-index">3</span>
      <span class="array-cell">A</span>
      <div class="marker"></div>
    </div><div class="array-slot">
      <span class="array-index">4</span>
      <span class="array-cell">C</span>
      <div class="marker"></div>
    </div><div class="array-slot">
      <span class="array-index">5</span>
      <span class="array-cell">B</span>
      <div class="marker"></div>
    </div><div class="array-slot">
      <span class="array-index">6</span>
      <span class="array-cell">D</span>
      <div class="marker"></div>
    </div></div>
    <p class="scene-note">Need: A × 2, B × 1</p>
  </div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current value</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other value</li></ul>
  </main>
</body>
</html>
