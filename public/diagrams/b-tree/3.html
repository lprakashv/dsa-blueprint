<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descend to the right leaf</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="graph-diagram pages"><svg viewBox="0 0 420 240" role="img" aria-label="Insert 40 into the right leaf" aria-describedby="graph-description">
    <desc id="graph-description">20. 10. 30  |  40. 20 to 10. 20 to 30  |  40.</desc>

    <g class="graph-edge">
    <line x1="210" y1="60" x2="105" y2="172.79999999999998"
      />

  </g><g class="graph-edge is-active">
    <line x1="210" y1="60" x2="315" y2="172.79999999999998"
      />

  </g>

    <g class="graph-node" transform="translate(210 60)">
        <title>20</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">20</text>

      </g><g class="graph-node" transform="translate(105 172.79999999999998)">
        <title>10</title>
        <rect x="-22" y="-20" width="44" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">10</text>

      </g><g class="graph-node is-active" transform="translate(315 172.79999999999998)">
        <title>30  |  40, current</title>
        <rect x="-42.75" y="-20" width="85.5" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">30  |  40</text>

      </g>
  </svg><p class="scene-note">Insert 40 into the right leaf</p></div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current page</li><li><span class="legend-dot teal" aria-hidden="true"></span>Matched or read page</li><li><span class="legend-dot gray" aria-hidden="true"></span>Child link</li></ul>
  </main>
</body>
</html>
