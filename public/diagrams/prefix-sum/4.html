<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remove the part before the range</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="lane-diagram">
    <div class="lane"><span class="lane-label">Prefix</span><div class="lane-cells"><span class="array-cell">0</span><span class="array-cell is-active">2</span><span class="array-cell">6</span><span class="array-cell">7</span><span class="array-cell is-active">10</span></div></div>
    <div class="lane"><span class="lane-label">Result</span><div class="lane-cells"><span class="array-cell is-active">8</span></div></div>
    <p class="scene-note">prefix[4] − prefix[1] = 8</p>
  </div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current value</li><li><span class="legend-dot gray" aria-hidden="true"></span>Other value</li></ul>
  </main>
</body>
</html>
