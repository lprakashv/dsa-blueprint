<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start with a full root page</title>
  <link rel="stylesheet" href="../whiteboard.css">
</head>
<body>
  <main>
    <div class="graph-diagram pages"><svg viewBox="0 0 420 240" role="img" aria-label="Capacity: 3 keys per page" aria-describedby="graph-description">
    <desc id="graph-description">10  |  20  |  30.</desc>



    <g class="graph-node is-active" transform="translate(210 115.19999999999999)">
        <title>10  |  20  |  30, current</title>
        <rect x="-69" y="-20" width="138" height="40" rx="10"/>
        <text class="graph-label" y="5" text-anchor="middle">10  |  20  |  30</text>

      </g>
  </svg><p class="scene-note">Capacity: 3 keys per page</p></div>
    <ul class="legend" aria-label="Whiteboard legend"><li><span class="legend-dot purple" aria-hidden="true"></span>Current page</li><li><span class="legend-dot teal" aria-hidden="true"></span>Matched or read page</li><li><span class="legend-dot gray" aria-hidden="true"></span>Child link</li></ul>
  </main>
</body>
</html>
